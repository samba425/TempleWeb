<div class="gallery" (window:keydown)="handleKeyPress($event)">
  <section class="page-hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>🕉️ Temple Gallery</h1>
      <p>Glimpses of Divine Moments at UTTHARANDHRA SABARIMALA</p>
    </div>
  </section>

  <section class="section-padding">
    <div class="container">
      <!-- Category Filter -->
      <div class="category-filter">
        <button 
          mat-button 
          *ngFor="let category of categories"
          [class.active]="selectedCategory === category"
          (click)="filterByCategory(category)">
          {{ category | titlecase }}
        </button>
      </div>

      <!-- Gallery Grid with Pagination -->
      <div class="gallery-grid">
        <div class="gallery-card" *ngFor="let image of displayedImages; let i = index" 
             (click)="openPreview(image.url || image.imageUrl, i)">
          <div class="card-image">
            <img 
              [src]="image.thumbnailUrl || image.url || image.imageUrl" 
              [alt]="image.title || 'Temple Image'" 
              loading="lazy">
            <div class="card-overlay">
              <mat-icon>zoom_in</mat-icon>
              <p>View Image</p>
            </div>
          </div>
          <div class="card-footer">
            <mat-icon>photo_camera</mat-icon>
            <span>{{ image.title || 'Temple Moment ' + (i + 1) }}</span>
          </div>
        </div>
      </div>

      <!-- Load More Button -->
      <div class="load-more" *ngIf="hasMore && !isLoading">
        <button mat-raised-button color="primary" (click)="loadMoreImages()">
          <mat-icon>expand_more</mat-icon>
          Load More Images
        </button>
      </div>

      <!-- Loading Indicator -->
      <div class="loading" *ngIf="isLoading">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Loading images...</p>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="displayedImages.length === 0 && !isLoading">
        <mat-icon>photo_library</mat-icon>
        <p>No images found in this category</p>
      </div>
    </div>
  </section>

  <!-- Image Preview Modal -->
  <div class="preview-modal" *ngIf="showPreview" (click)="closePreview()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closePreview()" mat-icon-button>
        <mat-icon>close</mat-icon>
      </button>
      
      <button class="nav-btn prev-btn" (click)="previousImage()" mat-icon-button>
        <mat-icon>chevron_left</mat-icon>
      </button>
      
      <div class="preview-image-container">
        <img [src]="currentImage" alt="Preview Image" class="preview-image">
        <div class="preview-info">
          <p>Image {{currentImageIndex + 1}} of {{localImages.length}}</p>
        </div>
      </div>
      
      <button class="nav-btn next-btn" (click)="nextImage()" mat-icon-button>
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>
</div>
